name: MRK Connect CI

on:
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - "Android/**"
      - "Shared/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-electron:
    name: Windows Electron + native input build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        run: npm install
      - name: Compile TypeScript
        run: npm run build
      - name: Build native Windows input helper
        run: npm run native:build
      - name: Package Windows app
        run: npm run pack

  android-expo:
    name: Android Expo typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
